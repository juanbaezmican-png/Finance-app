<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<title>Mis Finanzas</title>
<link rel="apple-touch-icon" id="touchIcon">
<link rel="icon" id="favIcon">
<style>
:root{
  --bg:#f5f5f7; --bg2:#ffffff; --card:#ffffff; --card2:#f5f5f7; --line:#e6e6e8; --hair:#d6d6d6;
  --text:#1d1d1f; --muted:#707070; --faint:#86868b;
  --accent:#0071e3; --accent2:#0066cc; --green:#248a3d; --red:#d70015; --amber:#b64400;
  --radius:28px; --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font-display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,Arial,sans-serif;
  --font-text:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-text);font-size:15px;line-height:1.43;letter-spacing:-.016em;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
b,strong{font-weight:600}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:calc(16px + var(--safe-t)) 16px calc(var(--nav-h) + 100px + var(--safe-b))}
.wrap{max-width:1080px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px;flex-wrap:wrap}
.topbar h1{font-family:var(--font-display);font-size:34px;line-height:1.08;margin:0;font-weight:600;letter-spacing:-.022em}
.monthsel{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:9999px;padding:3px;box-shadow:rgb(230,230,232) 0 0 0 1px}
.monthsel button{background:none;border:0;width:32px;height:32px;border-radius:50%;font-size:19px;color:var(--accent);line-height:1}
.monthsel button:hover{background:var(--card2)}
.monthsel span{min-width:120px;text-align:center;font-weight:500;font-size:14px;text-transform:capitalize}
@media (max-width:420px){.topbar h1{font-size:28px}.monthsel span{min-width:100px;font-size:13px}.monthsel button{width:28px}}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(250,250,252,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
.navbtn{flex:1;background:none;border:0;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:4px 0;font-weight:500;letter-spacing:-.01em}
.navbtn.active{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px + var(--safe-b));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(245,245,247,.9)}
.fab svg.i{width:28px;height:28px;stroke-width:2}
.fab:active{transform:scale(.94)}

@media (min-width:900px){
  .sidebar{display:flex;flex-direction:column;gap:2px;width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:28px 16px;background:var(--bg2);border-right:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:19px;padding:0 10px 26px}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
  .sidebar .navbtn{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 12px;border-radius:12px;color:var(--text);font-weight:400}
  .sidebar .navbtn svg.i{color:var(--faint)}
  .sidebar .navbtn:hover{background:var(--card2)}
  .sidebar .navbtn.active{background:var(--card2);font-weight:500}
  .sidebar .navbtn.active svg.i{color:var(--accent)}
  .sidebar .addbtn{margin-top:18px}
  .bottomnav{display:none}
  .fab{bottom:28px;right:28px}
  .main{padding:32px 40px 64px}
  .topbar h1{font-size:40px}
}

/* Cards */
.grid{display:grid;gap:16px}
.grid > *{min-width:0}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
@media (max-width:899px){.g2{grid-template-columns:1fr}}
@media (max-width:620px){.g3{grid-template-columns:1fr 1fr}.g3 .stat:first-child{grid-column:1/-1}}
.card{background:var(--card);border-radius:var(--radius);padding:24px}
@media (max-width:620px){.card{padding:20px}}
.card h2{font-family:var(--font-display);font-size:21px;line-height:1.19;margin:0 0 16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-family:var(--font-text);font-weight:400;color:var(--muted);font-size:14px;letter-spacing:-.016em}
.section{margin-top:16px}
.stat .lbl{color:var(--muted);font-size:14px;font-weight:400;display:flex;align-items:center;gap:6px}
.stat .val{font-family:var(--font-display);font-size:28px;font-weight:600;margin-top:6px;letter-spacing:-.02em;line-height:1.1}
.stat.hero .val{font-size:48px;letter-spacing:-.03em}
@media (min-width:900px){.stat.hero .val{font-size:44px}}
.stat .sub{font-size:13px;color:var(--muted);margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)} .muted{color:var(--muted)}
.compare{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:20px;background:var(--card);margin-top:16px;font-size:15px}
.compare .badge{color:var(--faint);display:flex}

.alerts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.alert{display:flex;gap:12px;align-items:center;padding:14px 20px;border-radius:20px;font-size:14px;background:var(--card)}
.alert .mk{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert.warn .mk{background:var(--amber)} .alert.over .mk{background:var(--red)}

/* Charts */
.chart svg{width:100%;height:auto;max-height:300px;display:block}
.donutwrap{display:flex;align-items:center;gap:24px}
.donutwrap .dsvg{width:170px;flex-shrink:0}
.legend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.legend .row{display:flex;align-items:center;gap:8px;font-size:14px}
.legend .row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .row .pc{color:var(--muted);width:44px;text-align:right}
.legend .row .am{width:90px;text-align:right;font-weight:500}
@media (max-width:480px){.donutwrap{flex-direction:column}.donutwrap .dsvg{width:190px}.legend{width:100%}}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:15px}
.empty .big{display:flex;justify-content:center;margin-bottom:10px;color:var(--faint)}
.empty .big svg.i{width:34px;height:34px;stroke-width:1.3}

/* Progress */
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog > i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.prog.warn > i{background:var(--amber)!important}
.prog.over > i{background:var(--red)!important}
.item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;background:var(--card2)!important}
.item .body{flex:1;min-width:0}
.item .t{font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .t > span:last-child{white-space:nowrap;flex-shrink:0}
.item .s{font-size:13px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.item .s span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.budget .prog{margin-top:8px}
.pi .t span:first-child{white-space:normal;overflow:visible;line-height:1.25}
.pi .s span:first-child{white-space:normal}
.pi{gap:10px}
.tag{font-size:12px;font-weight:600;margin-left:8px;letter-spacing:-.01em}
.tag.warn{color:var(--amber)} .tag.over{color:var(--red)} .tag.rec{color:var(--faint);font-weight:500}

/* Pockets */
.pockets{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.pocket{background:var(--card2);border-radius:22px;padding:16px;cursor:pointer}
.pocket .top{display:flex;align-items:center;gap:8px;font-weight:500;flex-wrap:wrap}
.pocket .left{font-family:var(--font-display);font-size:24px;font-weight:600;margin:12px 0 2px;letter-spacing:-.02em}
.pocket .of{font-size:12px;color:var(--muted);margin-bottom:12px}
.accounts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.acc{background:var(--card2);border-radius:22px;padding:18px;cursor:pointer}
.acc .hd{display:flex;align-items:center;gap:12px;font-weight:600}
.acc .hd .ico{background:var(--card)!important}
.acc .role{font-size:13px;color:var(--muted);margin:10px 0 12px;min-height:36px}
.acc .flows{display:flex;justify-content:space-between;font-size:14px}

/* Movements */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar .search{flex:1 1 220px}
.input,.select{width:100%;background:var(--card);border:1px solid var(--faint);border-radius:980px;padding:11px 18px;outline:none;min-height:44px;font-size:16px}
textarea.input{border-radius:16px}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.18)}
.select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 21px) 50%,calc(100% - 16px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.toolbar .input,.toolbar .select{border-color:transparent;font-size:15px}
.toolbar .select{flex:1 1 140px;width:auto}
.dayhead{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize;padding:18px 0 4px}
.mov{cursor:pointer}
.amt-g{color:var(--text)} .amt-i{color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--faint);color:var(--text);border-radius:9999px;padding:10px 18px;font-weight:400;font-size:14px;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn svg.i{width:17px;height:17px}
.btn.primary{background:var(--accent);box-shadow:none;color:#fff}
.btn.primary:hover{background:#0077ed}
.btn.danger{box-shadow:none;color:var(--red);background:var(--card2)}
.btn.ghost{box-shadow:none;color:var(--accent2)}
.btn.ghost:hover{background:transparent;text-decoration:underline}
.btn.sm{padding:6px 14px;min-height:32px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.summary-line{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 2px 6px}
.summary-line b{color:var(--text);font-weight:500}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(20px + var(--safe-b));animation:up .22s ease-out}
.sheet .grab{width:36px;height:5px;border-radius:9px;background:var(--hair);margin:0 auto 12px}
.sheet h3{font-family:var(--font-display);margin:0 0 16px;font-size:24px;font-weight:600;letter-spacing:-.015em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3 button{background:var(--line);border:0;width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:14px;flex-shrink:0}
.sheet .card{padding:16px 20px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:28px;padding-bottom:24px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin:0 0 6px 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f2 > *{min-width:0}
.seg{display:flex;background:var(--line);border-radius:9999px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9999px;font-weight:500;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 0 0 .5px rgba(0,0,0,.04)}
.amountbox{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 16px}
.amountbox input{background:none;border:0;outline:none;font-family:var(--font-display);font-size:52px;font-weight:600;letter-spacing:-.03em;text-align:center;width:100%;max-width:290px;font-variant-numeric:tabular-nums}
.amountbox span{font-family:var(--font-display);font-size:34px;color:var(--faint);font-weight:500}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.chip{border:0;background:var(--card);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:400;color:var(--text);text-align:center;line-height:1.15;box-shadow:inset 0 0 0 1px transparent}
.chip .e{font-size:21px}
.chip.on{box-shadow:inset 0 0 0 2px var(--accent);font-weight:500}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{background:var(--card);border:0;border-radius:12px;font-size:19px;padding:6px 0}
.emojis button.on{box-shadow:inset 0 0 0 2px var(--accent)}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:30px;height:30px;border-radius:50%;border:0}
.colors button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin:0 0 14px 4px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);z-index:80;background:rgba(29,29,31,.92);color:#fff;padding:12px 20px;border-radius:9999px;font-size:14px;font-weight:500;max-width:92vw;animation:drop .25s;text-align:center}
.toast.warn{background:var(--amber)} .toast.over{background:var(--red)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.settings-list .item{cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.hint a,.link{color:var(--accent2);text-decoration:none}
.demo-banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 20px;border-radius:20px;background:var(--card);font-size:14px;margin-bottom:16px}
.demo-banner .lbl{color:var(--amber);font-weight:600;font-size:12px;margin-right:6px}

/* Escáner */
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--card);color:var(--accent2);border-radius:9999px;padding:12px;font-size:15px;margin-bottom:14px}
.scanbtn svg.i{width:20px;height:20px}
.receipt-thumb{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.receipt-thumb img{width:54px;height:54px;object-fit:cover;border-radius:10px;cursor:zoom-in}
.scanning{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 10px;color:var(--muted);text-align:center}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-note{font-size:13px;color:var(--muted);background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:14px}
.ai-note b{color:var(--text)}
.bigimg{max-width:100%;border-radius:18px;display:block;margin:0 auto}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<button class="fab" id="fab" aria-label="Añadir movimiento" onclick="App.openMovement()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<input type="file" id="scanFile" accept="image/*,application/pdf" style="display:none">
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<script>
(function(){
'use strict';

/* ============ Utilidades ============ */
const KEY = 'misfinanzas_v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const ICONS = {
  inicio:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  movs:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  pockets:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><path d="M16 14.5h.01"/>',
  plan:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  down:'<path d="M12 4v12M6 11l6 6 6-6M5 20h14"/>', up:'<path d="M12 20V8M6 13l6-6 6 6M5 4h14"/>',

function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const ymOf = d => d.slice(0,7);
function addMonths(ym, n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad(m)}`; }
function daysInMonth(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function monthLabel(ym, short){ const [y,m]=ym.split('-').map(Number); return short ? MESES_C[m-1] : `${MESES[m-1]} ${y}`; }
function monthName(ym){ return MESES[Number(ym.split('-')[1])-1]; }
function dayLabel(ds){ const [y,m,d]=ds.split('-').map(Number); const dt=new Date(y,m-1,d); const t=todayStr(); if(ds===t) return 'Hoy'; const yd=new Date(); yd.setDate(yd.getDate()-1); if(ds===`${yd.getFullYear()}-${pad(yd.getMonth()+1)}-${pad(yd.getDate())}`) return 'Ayer'; return `${DIAS[dt.getDay()]}, ${d} de ${MESES[m-1]}`; }
function shortDate(ds){ const [y,m,d]=ds.split('-').map(Number); return `${d} ${MESES_C[m-1]} ${y}`; }

// Formato español fijo: 1.234,56 €  (Intl con es-ES no agrupa números de 4 cifras)
function fmtNum(n, dec=2){ const neg=n<0; const s=Math.abs(n).toFixed(dec); let [i,d]=s.split('.'); i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return (neg?'-':'')+i+(dec?','+d:''); }
const eur = (n, dec=2) => fmtNum(round2(n), dec)+' €';
const eurK = n => Math.abs(n)>=1000 ? fmtNum(n/1000, 1).replace(',0','')+'k €' : fmtNum(n,0)+' €';
const pct = n => fmtNum(n,0)+' %';
function parseAmount(v){
  v=String(v||'').trim().replace(/\s|€/g,'');
  if(!v) return NaN;
  if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
  else if((v.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(v)) v=v.replace(/\./g,'');
  return parseFloat(v);
}

/* ============ Recurrentes ============ */
function runRecurring(){
  // Con los bancos conectados los gastos fijos sirven para planificar: los movimientos reales llegan del banco
  if(S.settings.syncUrl && S.settings.syncPass) return 0;
  const t=todayStr(), cur=ymOf(t); let n=0;
  for(const r of S.recurring){
    if(!r.active) continue;
    r.generated = r.generated || [];
    let m=r.start;
    let guard=0;
    while(m<=cur && guard++<240){
      if(!r.generated.includes(m)){
        const date=`${m}-${pad(Math.min(r.day, daysInMonth(m)))}`;
        if(date<=t){
          const pf = S.plans && S.plans[m] && S.plans[m].fixed && S.plans[m].fixed[r.id];
          if(pf && pf.off){ r.generated.push(m); m=addMonths(m,1); continue; }
          S.movements.push({id:uid(),type:r.type,amount: pf && pf.amount!=null ? pf.amount : r.amount,categoryId:r.categoryId,date,method:r.method||'Domiciliación',accountId:r.accountId||'',pocketId:r.pocketId||'',note:r.name,recurringId:r.id,sample:!!r.sample});
          r.generated.push(m); n++;
        }
      }
      m=addMonths(m,1);
    }
  }
  if(n) save();
  return n;
}

/* ============ Cálculos ============ */
const movsOf = ym => S.movements.filter(m=>m.date.startsWith(ym));
function totals(ym){ let inc=0,exp=0; for(const m of movsOf(ym)){ if(m.type==='ingreso') inc+=m.amount; else exp+=m.amount; } return {inc:round2(inc),exp:round2(exp),left:round2(inc-exp)}; }
function expByCat(ym){ const o={}; for(const m of movsOf(ym)) if(m.type==='gasto') o[m.categoryId]=(o[m.categoryId]||0)+m.amount; return o; }
// Lo asignado a un pocket en un mes: lo que has metido en él ese mes según Revolut; si no hay traspasos, el valor por defecto
function alloc(p, ym){ const b = S.bankAlloc && S.bankAlloc[ym] && S.bankAlloc[ym][p.id]; if(b>0) return round2(b); const pl = S.plans && S.plans[ym] && S.plans[ym].pockets[p.id]; return round2(pl!=null ? pl : (+p.monthly||0)); }
const allocFromBank = (p, ym) => !!(S.bankAlloc && S.bankAlloc[ym] && S.bankAlloc[ym][p.id]>0);
function pocketSpent(pid, ym){ return round2(movsOf(ym).filter(m=>m.type==='gasto'&&m.pocketId===pid).reduce((a,m)=>a+m.amount,0)); }
function level(spent, limit){ if(!limit) return ''; const r=spent/limit; return r>1 ? 'over' : r>=0.8 ? 'warn' : ''; }
function budgetAlerts(ym){
  const out=[]; const by=expByCat(ym);
  for(const c of S.categories.filter(c=>c.type==='gasto'&&c.budget>0)){
    const sp=by[c.id]||0, l=level(sp,c.budget);
    if(l) out.push({l, icon:c.icon, text: l==='over' ? `Te has pasado en <b>${esc(c.name)}</b>: ${eur(sp)} de ${eur(c.budget)} (+${eur(sp-c.budget)})` : `Cerca del límite en <b>${esc(c.name)}</b>: llevas ${eur(sp)} de ${eur(c.budget)} (${pct(sp/c.budget*100)})`});
  }
  for(const p of S.pockets.filter(p=>alloc(p,ym)>0)){
    const sp=pocketSpent(p.id,ym), l=level(sp,alloc(p,ym));
    if(l) out.push({l, icon:p.icon, text: l==='over' ? `Pocket <b>${esc(p.name)}</b> en negativo: has gastado ${eur(sp-alloc(p,ym))} más de lo asignado` : `Pocket <b>${esc(p.name)}</b> casi vacío: quedan ${eur(alloc(p,ym)-sp)}`});
  }
  return out.sort((a,b)=>(a.l==='over'?0:1)-(b.l==='over'?0:1));
}
function subsList(){ return S.recurring.filter(r=>r.active && r.type==='gasto' && (r.isSub || r.categoryId==='subs')); }

/* ============ Gráficos SVG ============ */
function donut(items, total){
  if(!total) return `<div class="empty"><span class="big">${ic('chart')}</span>Aún no hay gastos este mes</div>`;
  const R=60, C=2*Math.PI*R; let off=0;
  const segs = items.map(it=>{ const len=it.value/total*C; const gap = items.length>1 ? Math.min(2, len*0.3) : 0; const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${it.color}" stroke-width="22" stroke-dasharray="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(it.label)}: ${eur(it.value)}</title></circle>`; off+=len; return s; }).join('');
  const legend = items.map(it=>`<div class="row"><span class="dot" style="background:${it.color}"></span><span class="nm">${it.icon} ${esc(it.label)}</span><span class="pc num">${pct(it.value/total*100)}</span><span class="am num">${eur(it.value)}</span></div>`).join('');
  return `<div class="donutwrap"><div class="dsvg chart"><svg viewBox="0 0 160 160"><circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--line)" stroke-width="22"/>${segs}<text x="80" y="76" text-anchor="middle" fill="var(--muted)" font-size="11" font-weight="400">Gastos</text><text x="80" y="95" text-anchor="middle" fill="var(--text)" font-size="${total>=10000?15:17}" font-weight="600">${eur(total,0)}</text></svg></div><div class="legend">${legend}</div></div>`;
}
function barsChart(months){
  const data = months.map(m=>({m, v: totals(m).exp}));
  const max = Math.max(...data.map(d=>d.v), 1);
  const W=360,H=180,pt=22,pb=26,bw=34, step=W/data.length;
  const bars = data.map((d,i)=>{ const h=(d.v/max)*(H-pt-pb); const x=i*step+(step-bw)/2, y=H-pb-h; const sel=d.m===ui.month;
    return `<g style="cursor:pointer" onclick="App.setMonth('${d.m}')"><rect x="${i*step}" y="0" width="${step}" height="${H}" fill="transparent"/><rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,2)}" rx="7" fill="${sel?'var(--accent)':'var(--line)'}"/>${d.v?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="10.5" font-weight="500" fill="${sel?'var(--text)':'var(--muted)'}">${eurK(d.v)}</text>`:''}<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${sel?'var(--text)':'var(--muted)'}" font-weight="${sel?600:400}">${monthLabel(d.m,true)}</text><title>${monthLabel(d.m)}: ${eur(d.v)}</title></g>`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${bars}</svg></div>`;
}
function savingsChart(months){
  const data = months.map(m=>({m, v: totals(m).left}));
  let acc0=0; const cum = data.map(d=>acc0=round2(acc0+d.v));
  const vals=[...data.map(d=>d.v), ...cum, 0];
  const max=Math.max(...vals), min=Math.min(...vals), span=(max-min)||1;
  const W=360,H=190,pt=24,pb=26, step=W/data.length, bw=22;
  const y = v => pt + (max-v)/span*(H-pt-pb);
  const y0=y(0);
  const bars = data.map((d,i)=>{ const x=i*step+(step-bw)/2; const top=Math.min(y(d.v),y0), h=Math.max(Math.abs(y(d.v)-y0),1.5);
    return `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="5" fill="${d.v>=0?'rgba(36,138,61,.22)':'rgba(215,0,21,.28)'}"><title>${monthLabel(d.m)}: ${eur(d.v)}</title></rect><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${monthLabel(d.m,true)}</text>`; }).join('');
  const pts = cum.map((c,i)=>`${i*step+step/2},${y(c)}`).join(' ');
  const dots = cum.map((c,i)=>`<circle cx="${i*step+step/2}" cy="${y(c)}" r="4" fill="var(--bg2)" stroke="var(--accent)" stroke-width="2.5"><title>Acumulado ${monthLabel(data[i].m)}: ${eur(c)}</title></circle>`).join('');
  const last = cum[cum.length-1];
  const lx = (cum.length-1)*step+step/2;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--line)" stroke-dasharray="3 4"/>${bars}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${Math.min(lx, W-4)}" y="${Math.max(y(last)-10, 12)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--accent)">${eurK(last)}</text></svg></div>
  <div class="summary-line" style="margin-top:8px"><span><span class="dot" style="background:rgba(36,138,61,.45)"></span> Ahorro de cada mes</span><span><span class="dot" style="background:var(--accent)"></span> Acumulado en 6 meses: <b class="num">${eur(last)}</b></span></div>`;
}

function filteredMovs(){
  const f=ui.f, q=f.q.trim().toLowerCase();
  return movsOf(ui.month).filter(m=>{
    if(f.type && m.type!==f.type) return false;
    if(f.cat && m.categoryId!==f.cat) return false;
    if(f.method && m.method!==f.method) return false;
    if(f.where){ const [k,id]=f.where.split(':'); if(k==='a' && m.accountId!==id) return false; if(k==='p' && m.pocketId!==id) return false; }

    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date) || (b._t||0)-(a._t||0));
}

const MESES_CORTOS = MESES.map(m=>m[0].toUpperCase()+m.slice(1,3));
function forecastIncome(ym){
  const f=S.incomeForecast; if(!f) return null;
  const o=f.overrides && f.overrides[ym]; if(o && o.amount!=null) return round2(o.amount);
  const m=+ym.slice(5); let v=+f.base||0;
  if((f.halfMonths||[]).includes(m)) v+=+f.half||0;
  if((f.fullMonths||[]).includes(m)) v+=+f.full||0;
  return round2(v);
}
function forecastLabel(ym){
  const f=S.incomeForecast; if(!f) return '';
  const o=f.overrides && f.overrides[ym]; if(o) return o.note || 'mes especial';
  const m=+ym.slice(5);
  if((f.fullMonths||[]).includes(m)) return 'paga extra';
  if((f.halfMonths||[]).includes(m)) return 'media paga extra';
  return '';
}
// Ahorro de partida: saldo de Trade Republic si está conectado; si no, lo guardado en objetivos
function savingsNow(){
  const tr=(S.bank?.accounts||[]).filter(a=>/trade/i.test(a.aspsp) && a.balance && Number.isFinite(a.balance.amount));
  if(tr.length) return { amount: round2(tr.reduce((s,a)=>s+a.balance.amount,0)), src:'saldo de Trade Republic' };
  return { amount: round2(S.goals.reduce((s,g)=>s+(+g.saved||0),0)), src:'lo guardado en tus objetivos' };
}
function forecastRows(n){
  const start=ymOf(todayStr()); const rows=[]; let acc=savingsNow().amount;
  for(let i=0;i<n;i++){
    const ym=addMonths(start,i), pt=planTotals(ym);
    const extra=Math.max(pt.free,0);
    acc=round2(acc+pt.saving+extra);
    rows.push({ ym, inc:pt.inc, fixed:pt.fixed, pockets:pt.pockets, saving:pt.saving, free:pt.free, acc, label:forecastLabel(ym) });
  }
  return rows;
}

    ${rows.map(r=>`<div class="item pi" style="cursor:pointer" onclick="App.setMonth('${r.ym}');window.scrollTo({top:0,behavior:'smooth'})"><div class="body"><div class="t"><span style="text-transform:capitalize">${monthLabel(r.ym)}${r.label?`<span class="tag rec">${esc(r.label)}</span>`:''}</span><span class="num green">+${eur(r.saving+Math.max(r.free,0),0)}</span></div><div class="s"><span>Entra <b class="num">${eur(r.inc,0)}</b> · fijos ${eur(r.fixed,0)} · pockets ${eur(r.pockets,0)}${r.free<0?` · <span class="red">faltan ${eur(-r.free,0)}</span>`:''}</span><span class="num">${eur(r.acc,0)}</span></div></div></div>`).join('')}

// keep=true guarda el plan; los meses futuros sin tocar se calculan al vuelo copiando el último plan guardado
function planFor(ym, keep){
  S.plans = S.plans || {};
  if(S.plans[ym]) return S.plans[ym];
  // Un mes nuevo empieza copiando el plan del anterior
  let prev=null; for(let i=1;i<=12 && !prev;i++) prev=S.plans[addMonths(ym,-i)];
  const p = { income:null, fixed:{}, extras:[], pockets:{}, saving:0 };
  if(prev){ if(prev.incomeManual && !S.incomeForecast){ p.income=prev.income; } p.saving=prev.saving||0; p.pockets={...prev.pockets}; for(const [k,v] of Object.entries(prev.fixed||{})) p.fixed[k]={ amount:v.amount, off:false }; }
  if(keep || ym<=ymOf(todayStr())) S.plans[ym]=p;
  return p;
}
const hasPlan = ym => !!(S.plans && S.plans[ym]);
const hasPlanTouched = ym => !!(S.plans && S.plans[ym] && S.plans[ym].touched);
function planIncome(ym){ const p=planFor(ym);
  if(p.income!=null && (p.incomeManual || !S.incomeForecast)) return p.income;
  const fc=forecastIncome(ym);
  if(fc!=null){ const recv = ym<=ymOf(todayStr()) ? receivedIncome(ym) : 0; return recv>0 ? recv : fc; }
  if(p.income!=null) return p.income;
  return round2(S.recurring.filter(r=>r.active && r.type==='ingreso').reduce((a,r)=>a+r.amount,0)); }
const receivedIncome = ym => round2(movsOf(ym).filter(m=>m.type==='ingreso' && m.categoryId==='nomina').reduce((a,m)=>a+m.amount,0));
function fixedItems(ym){
  const p=planFor(ym);
  const rec = S.recurring.filter(r=>r.active && r.type==='gasto').map(r=>({ kind:'fixed', id:r.id, name:r.name, categoryId:r.categoryId, accountId:r.accountId, day:r.day, isSub:r.isSub||r.categoryId==='subs', amount: p.fixed[r.id]?.amount ?? r.amount, off: !!p.fixed[r.id]?.off, paid: p.fixed[r.id]?.paid }));
  const ex = (p.extras||[]).map(e=>({ kind:'extra', id:e.id, name:e.name, categoryId:e.categoryId, accountId:e.accountId, day:e.day||'', amount:e.amount, off:false, paid:e.paid }));
  const items=[...rec, ...ex].sort((a,b)=>(+a.day||32)-(+b.day||32));
  // ¿Ya se ha pagado? Se busca en los movimientos del mes un gasto con importe parecido y el mismo nombre, categoría o cuenta
  const used=new Set();
  const ms=movsOf(ym).filter(m=>m.type==='gasto');
  for(const it of items){
    if(it.off) continue;
    if(it.paid===false) continue;
    const key=norm(it.name).split(' ')[0]||'';
    const cand=ms.filter(m=>!used.has(m.id) && Math.abs(m.amount-it.amount)<=Math.max(1, it.amount*0.1));
    const hit = cand.find(m=>m.recurringId===it.id) || cand.find(m=>key.length>2 && norm(m.note+' '+(m.bankDesc||'')).includes(key)) || cand.find(m=>m.categoryId===it.categoryId && (!it.accountId || !m.accountId || m.accountId===it.accountId));
    if(hit){ used.add(hit.id); it.paidMov=hit; }
  }
  for(const it of items) it.isPaid = !it.off && (it.paid===true || !!it.paidMov);
  return items;
}
const plannedPocket = (p, ym) => { const v=planFor(ym).pockets[p.id]; return v!=null ? v : (+p.monthly||0); };
function planTotals(ym){
  const p=planFor(ym), inc=planIncome(ym), items=fixedItems(ym).filter(i=>!i.off);
  const fixed=round2(items.reduce((a,i)=>a+i.amount,0)), pockets=round2(S.pockets.reduce((a,x)=>a+plannedPocket(x,ym),0)), saving=round2(+p.saving||0);
  return { inc, fixed, pockets, saving, free: round2(inc-fixed-pockets-saving), paid: round2(items.filter(i=>i.isPaid).reduce((a,i)=>a+i.amount,0)), items };
}

function monthSummary(ym){

  const top=Object.entries(expByCat(ym)).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,v])=>`${cat(id).icon} ${esc(cat(id).name)} <b class="num">${eur(v)}</b>`).join(' · ');
  let planLine='';

function planSet(ym, kind, id, value){
  const p=planFor(ym, true); const v = value==='' ? null : round2(parseAmount(value));
  if(value!=='' && !(v>=0)){ toast('Importe no válido','over'); render(); return; }
  if(kind==='income'){ p.income=v; p.incomeManual = v!=null; }
  else if(kind==='saving') p.saving=v||0;
  else if(kind==='pocket'){ if(v==null) delete p.pockets[id]; else p.pockets[id]=v; }
  else if(kind==='fixed'){ p.fixed[id]={ ...(p.fixed[id]||{}), amount: v==null ? (S.recurring.find(r=>r.id===id)?.amount||0) : v }; }
  else if(kind==='extra'){ const e=p.extras.find(x=>x.id===id); if(e) e.amount=v||0; }
  p.touched=true; save(); render();
}
function planItemMenu(ym, kind, id){
  const p=planFor(ym, true);
  const it=fixedItems(ym).find(i=>i.id===id && i.kind===kind); if(!it) return;
  modal(esc(it.name), `
    <div class="row-btns" style="flex-direction:column">
      ${kind==='fixed'?`<button class="btn block" id="pmOff">${it.off?'Sí toca este mes':'No toca este mes'}</button>`:''}
      ${it.off?'':`<button class="btn block" id="pmPaid">${it.isPaid?'Marcar como pendiente':'Marcar como pagado'}</button>`}
      ${kind==='fixed'?`<button class="btn block" onclick="App.editRecurring('${id}')">Editar gasto fijo (todos los meses)</button>`:`<button class="btn danger block" id="pmDel">Quitar de este mes</button>`}
    </div>`, o=>{
    o.querySelector('#pmOff')?.addEventListener('click',()=>{ p.fixed[id]={ ...(p.fixed[id]||{}), amount: it.amount, off: !it.off }; save(); closeModal(); render(); });
    o.querySelector('#pmPaid')?.addEventListener('click',()=>{ const val = it.isPaid ? false : true;
      if(kind==='fixed') p.fixed[id]={ ...(p.fixed[id]||{}), amount: it.amount, paid: val }; else { const e=p.extras.find(x=>x.id===id); if(e) e.paid=val; }
      save(); closeModal(); render(); });
    o.querySelector('#pmDel')?.addEventListener('click',()=>{ p.extras=p.extras.filter(x=>x.id!==id); save(); closeModal(); render(); });
  });
}

/* ============ Modales ============ */
function modal(title, body, onMount){
  closeModal();
  const o=document.createElement('div'); o.className='overlay'; o.id='overlay';
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><h3><span>${title}</span><button onclick="App.close()" aria-label="Cerrar">✕</button></h3>${body}</div>`;
  o.addEventListener('click',e=>{ if(e.target===o) closeModal(); });
  document.body.appendChild(o); document.body.style.overflow='hidden';
  onMount && onMount(o);
}
function closeModal(){ const o=$('#overlay'); if(o) o.remove(); document.body.style.overflow=''; }
const val = id => document.getElementById(id)?.value;

function emojiPicker(sel){ return `<div class="emojis" id="emojiPick">${EMOJIS.map(e=>`<button type="button" class="${e===sel?'on':''}" data-e="${e}">${e}</button>`).join('')}</div>`; }
function colorPicker(sel){ return `<div class="colors" id="colorPick">${COLORS.map(c=>`<button type="button" class="${c===sel?'on':''}" data-c="${c}" style="background:${c}" aria-label="color"></button>`).join('')}</div>`; }
function bindPickers(o, st){
  o.querySelector('#emojiPick')?.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; st.icon=b.dataset.e; o.querySelectorAll('#emojiPick button').forEach(x=>x.classList.toggle('on',x===b)); });
  o.querySelector('#colorPick')?.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; st.color=b.dataset.c; o.querySelectorAll('#colorPick button').forEach(x=>x.classList.toggle('on',x===b)); });
}
const opts = (arr, sel, empty) => (empty!==undefined?`<option value="">${empty}</option>`:'') + arr.map(([v,l])=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`).join('');

function openMovement(id, preset={}){
  const m = id ? S.movements.find(x=>x.id===id) : null;
  const curM=ymOf(todayStr());
  const defDate = ui.month===curM ? todayStr() : (ui.month<curM ? `${ui.month}-${pad(daysInMonth(ui.month))}` : `${ui.month}-01`);
  const st = m ? {...m} : {type:'gasto', amount:'', categoryId:'', date:defDate, method:'Tarjeta', accountId:'', pocketId:'', note:'', ...preset};
  const body = `
    ${m ? '' : `<button type="button" class="scanbtn" onclick="App.scan()">${ic('scan')} Escanear ticket o factura</button>`}
    ${st.aiNote ? `<div class="ai-note">${st.aiNote}</div>` : ''}
    ${st.receipt ? `<div class="receipt-thumb" id="rcptBox"><img id="rcptImg" alt="Ticket" style="display:none"><span id="rcptTxt">Ticket adjunto</span></div>` : ''}
    <div class="seg" id="typeSeg"><button type="button" data-t="gasto" class="g ${st.type==='gasto'?'on':''}">Gasto</button><button type="button" data-t="ingreso" class="i ${st.type==='ingreso'?'on':''}">Ingreso</button></div>
    <div class="amountbox"><input id="mAmount" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${st.amount!==''?fmtNum(st.amount).replace(/\./g,''):''}"><span>€</span></div>
    <div class="field"><label>Categoría</label><div class="chips" id="catChips"></div></div>
    <div class="f2"><div class="field"><label>Fecha</label><input class="input" type="date" id="mDate" value="${st.date}"></div>
    <div class="field"><label>Método de pago</label><select class="select" id="mMethod">${opts(METODOS.map(x=>[x,x]), st.method)}</select></div></div>
    <div class="f2"><div class="field" id="pocketField"><label>Pocket (Revolut)</label><select class="select" id="mPocket">${opts(S.pockets.map(p=>[p.id,`${p.icon} ${p.name}`]), st.pocketId, 'Ninguno')}</select></div>
    <div class="field"><label>Cuenta</label><select class="select" id="mAccount">${opts(S.accounts.map(a=>[a.id,`${a.icon} ${a.name}`]), st.accountId, 'Sin especificar')}</select></div></div>
    <div class="field"><label>Nota (opcional)</label><input class="input" id="mNote" placeholder="Ej. Mercadona, cena con amigos…" value="${esc(st.note)}" maxlength="80"></div>
    ${m&&m.recurringId?'<p class="hint" style="margin-top:-4px">Generado por un gasto fijo. Si lo cambias solo afecta a este mes.</p>':''}
    <button class="btn primary block" id="mSave" style="min-height:50px;font-size:16px;margin-top:4px">${m?'Guardar cambios':'Añadir'}</button>
    ${m?`<button class="btn danger block" style="margin-top:8px" onclick="App.delMovement('${m.id}')">Eliminar movimiento</button>`:''}`;
  modal(m?'Editar movimiento':'Nuevo movimiento', body, o=>{
    const drawCats=()=>{ const cs=S.categories.filter(c=>c.type===st.type); if(!cs.some(c=>c.id===st.categoryId)) st.categoryId='';
      o.querySelector('#catChips').innerHTML = cs.map(c=>`<button type="button" class="chip ${c.id===st.categoryId?'on':''}" data-id="${c.id}" style="--c:${c.color}"><span class="e">${c.icon}</span>${esc(c.name)}</button>`).join('');
      o.querySelector('#pocketField').style.display = st.type==='gasto' && S.pockets.length ? '' : 'none'; };
    drawCats();
    if(st.receipt){ const show=url=>{ if(!url) return; const im=o.querySelector('#rcptImg'); im.src=url; im.style.display=''; o.querySelector('#rcptTxt').textContent='Ticket adjunto · toca para ampliar'; im.onclick=()=>{ const big=o.querySelector('#rcptBig'); if(big){ big.remove(); return; } const b=document.createElement('img'); b.id='rcptBig'; b.className='bigimg'; b.src=url; b.style.marginBottom='14px'; o.querySelector('#rcptBox').after(b); }; };
      if(pendingReceipt && pendingReceipt.key===st.receipt) show(pendingReceipt.url); else RDB.get(st.receipt).then(show).catch(()=>{}); }
    o.querySelector('#typeSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; st.type=b.dataset.t; o.querySelectorAll('#typeSeg button').forEach(x=>x.classList.toggle('on',x===b)); if(st.type==='ingreso'){ st.pocketId=''; o.querySelector('#mPocket').value=''; if(o.querySelector('#mMethod').value==='Tarjeta') o.querySelector('#mMethod').value='Transferencia'; } drawCats(); });
    o.querySelector('#catChips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; st.categoryId=b.dataset.id; o.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
      // Sugerir el pocket asociado a la categoría
      const p=S.pockets.find(p=>(p.categories||[]).includes(st.categoryId)); if(p && st.type==='gasto' && !o.querySelector('#mPocket').value){ o.querySelector('#mPocket').value=p.id; o.querySelector('#mPocket').dispatchEvent(new Event('change')); } });
    o.querySelector('#mPocket').addEventListener('change',e=>{ if(e.target.value){ const r=S.accounts.find(a=>a.id==='revolut'); if(r) o.querySelector('#mAccount').value='revolut'; o.querySelector('#mMethod').value='Tarjeta'; } });
    const a=o.querySelector('#mAmount'); if(!m) setTimeout(()=>a.focus(),60);
    a.addEventListener('keydown',e=>{ if(e.key==='Enter') o.querySelector('#mSave').click(); });
    o.querySelector('#mSave').addEventListener('click',()=>{
      const amount=round2(parseAmount(a.value));
      if(!(amount>0)){ toast('Escribe un importe válido','over'); a.focus(); return; }
      if(!st.categoryId){ toast('Elige una categoría','over'); return; }
      const date=val('mDate'); if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('Fecha no válida','over'); return; }
      if(pendingReceipt && pendingReceipt.key===st.receipt && pendingReceipt.url){ RDB.put(st.receipt, pendingReceipt.url).catch(e=>toast('No se pudo guardar la foto del ticket','over')); pendingReceipt=null; }
      const rec={...st, amount, date, method:val('mMethod'), accountId:val('mAccount')||'', pocketId: st.type==='gasto'?(val('mPocket')||''):'', note:val('mNote').trim()};
      const before = rec.type==='gasto' ? snapshotLevels(ymOf(date)) : null;
      delete rec.aiNote;
      if(m && m.bankId && m.merchantKey && rec.categoryId!==m.categoryId){ (S.settings.merchantMap=S.settings.merchantMap||{})[m.merchantKey]=rec.categoryId; }
      if(m){ Object.assign(m, rec); m.sample=false; } else { rec.id=uid(); rec._t=Date.now(); rec.sample=false; S.movements.push(rec); }
      save(); closeModal();
      if(ymOf(date)!==ui.month) ui.month=ymOf(date);
      render();
      const warn = before ? newAlert(before, rec) : null;
      warn ? toast(warn.text, warn.l) : toast(m?'Cambios guardados':(rec.type==='gasto'?'Gasto añadido':'Ingreso añadido'),'ok');
    });
  });
}
function snapshotLevels(ym){ const by=expByCat(ym), o={}; for(const c of S.categories) if(c.budget) o['c'+c.id]=level(by[c.id]||0,c.budget); for(const p of S.pockets) if(alloc(p,ym)) o['p'+p.id]=level(pocketSpent(p.id,ym),alloc(p,ym)); return o; }
function newAlert(before, rec){
  const ym=ymOf(rec.date), after=snapshotLevels(ym); const rank={'':0,warn:1,over:2};
  const c=cat(rec.categoryId), p=pocket(rec.pocketId);
  if(c.budget && rank[after['c'+c.id]]>rank[before['c'+c.id]||'']){ const sp=expByCat(ym)[c.id]||0; return after['c'+c.id]==='over' ? {l:'over',text:`Te has pasado del presupuesto de ${c.name} (${eur(sp)} de ${eur(c.budget)})`} : {l:'warn',text:`Cuidado: llevas el ${pct(sp/c.budget*100)} del presupuesto de ${c.name}`}; }
  if(p && alloc(p,ym) && rank[after['p'+p.id]]>rank[before['p'+p.id]||'']){ const left=alloc(p,ym)-pocketSpent(p.id,ym); return after['p'+p.id]==='over' ? {l:'over',text:`El pocket ${p.name} está en negativo (${eur(left)})`} : {l:'warn',text:`Al pocket ${p.name} le quedan ${eur(left)}`}; }
  return null;
}
function delMovement(id){ if(!confirm('¿Eliminar este movimiento?')) return; const mv=S.movements.find(m=>m.id===id); if(mv&&mv.receipt) RDB.del(mv.receipt).catch(()=>{}); S.movements=S.movements.filter(m=>m.id!==id); save(); closeModal(); render(); toast('Movimiento eliminado','ok'); }

function editCategory(id, type){
  const c = id ? S.categories.find(x=>x.id===id) : null;
  const st = c ? {...c} : {name:'', icon: type==='ingreso'?'💰':'📦', color:COLORS[0], type, budget:0};
  const used = c ? S.movements.filter(m=>m.categoryId===c.id).length : 0;
  modal(c?'Editar categoría':'Nueva categoría', `
    <div class="field"><label>Nombre</label><input class="input" id="cName" value="${esc(st.name)}" maxlength="30" placeholder="Ej. Mascotas"></div>
    ${st.type==='gasto'?`<div class="field"><label>Presupuesto mensual (opcional)</label><input class="input" id="cBudget" inputmode="decimal" placeholder="0,00 €" value="${st.budget?fmtNum(st.budget).replace(/\./g,''):''}"></div>`:''}
    <div class="field"><label>Icono</label>${emojiPicker(st.icon)}</div>
    <div class="field"><label>Color</label>${colorPicker(st.color)}</div>
    <button class="btn primary block" id="cSave">${c?'Guardar':'Crear categoría'}</button>
    ${c?`<button class="btn danger block" style="margin-top:8px" id="cDel">Eliminar categoría${used?` (${used} movimientos pasarán a “Otros”)`:''}</button>`:''}`, o=>{
    bindPickers(o, st);
    o.querySelector('#cSave').onclick=()=>{ const name=val('cName').trim(); if(!name){ toast('Pon un nombre','over'); return; }
      const budget = st.type==='gasto' ? (round2(parseAmount(val('cBudget')))||0) : 0;
      if(c) Object.assign(c,{name,icon:st.icon,color:st.color,budget}); else S.categories.push({id:uid(),name,icon:st.icon,color:st.color,type:st.type,budget});
      save(); closeModal(); render(); toast('Categoría guardada','ok'); };
    o.querySelector('#cDel')?.addEventListener('click',()=>{
      const fallback = st.type==='gasto' ? 'otros_g' : 'otros_i';
      if(S.categories.filter(x=>x.type===st.type).length<=1){ toast('Necesitas al menos una categoría','over'); return; }
      if(!confirm(`¿Eliminar la categoría “${c.name}”?`)) return;
      let target = S.categories.find(x=>x.id===fallback && x.id!==c.id) || S.categories.find(x=>x.type===st.type && x.id!==c.id);
      S.movements.forEach(m=>{ if(m.categoryId===c.id) m.categoryId=target.id; });
      S.recurring.forEach(r=>{ if(r.categoryId===c.id) r.categoryId=target.id; });
      S.pockets.forEach(p=>{ p.categories=(p.categories||[]).filter(x=>x!==c.id); });
      S.categories=S.categories.filter(x=>x.id!==c.id); save(); closeModal(); render(); toast('Categoría eliminada','ok'); });
  });
}
function editBudget(id){
  const c=cat(id);
  modal(`Presupuesto · ${c.icon} ${esc(c.name)}`, `
    <div class="field"><label>Límite mensual</label><input class="input" id="bAmt" inputmode="decimal" placeholder="0,00 €" value="${c.budget?fmtNum(c.budget).replace(/\./g,''):''}"></div>

function editRecurring(id, preset={}){
  const r = id ? S.recurring.find(x=>x.id===id) : null;
  const st = r ? {...r} : {name:'', type:'gasto', amount:'', categoryId:'', accountId:'', pocketId:'', method:'Domiciliación', day:new Date().getDate(), active:true, isSub:false, ...preset};
  const body=`

    <div class="f2"><div class="field"><label>Método</label><select class="select" id="rMethod">${opts(METODOS.map(x=>[x,x]), st.method)}</select></div>
    <div class="field" id="rPocketF"><label>Pocket</label><select class="select" id="rPocket">${opts(S.pockets.map(p=>[p.id,`${p.icon} ${p.name}`]), st.pocketId, 'Ninguno')}</select></div></div>
    <label class="check" id="rSubL"><input type="checkbox" id="rSub" ${st.isSub?'checked':''}> Es una suscripción (sale en el resumen de suscripciones)</label>
    ${r?`<label class="check"><input type="checkbox" id="rActive" ${st.active?'checked':''}> Activo (si lo desactivas deja de apuntarse)</label>`:`<p class="hint" style="margin-top:-4px">Se apuntará desde este mes. Si el día ya ha pasado, se añade ahora.</p>`}
    <button class="btn primary block" id="rSave" style="margin-top:6px">${r?'Guardar':'Crear'}</button>
    ${r?`<button class="btn danger block" style="margin-top:8px" id="rDel">Eliminar gasto fijo</button>`:''}`;
  modal(r?'Editar recurrente':'Nuevo recurrente', body, o=>{
    const draw=()=>{ o.querySelector('#rCat').innerHTML=opts(S.categories.filter(c=>c.type===st.type).map(c=>[c.id,`${c.icon} ${c.name}`]), st.categoryId); st.categoryId=o.querySelector('#rCat').value;
      o.querySelector('#rSubL').style.display=st.type==='gasto'?'':'none'; o.querySelector('#rPocketF').style.display=st.type==='gasto'&&S.pockets.length?'':'none'; };
    draw();
    o.querySelector('#rCat').onchange=e=>{ st.categoryId=e.target.value; if(st.categoryId==='subs') o.querySelector('#rSub').checked=true; };
    o.querySelector('#rType').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; st.type=b.dataset.t; o.querySelectorAll('#rType button').forEach(x=>x.classList.toggle('on',x===b)); if(st.type==='ingreso') o.querySelector('#rMethod').value='Transferencia'; draw(); };
    o.querySelector('#rSave').onclick=()=>{
      const name=val('rName').trim(), amount=round2(parseAmount(val('rAmt'))), day=Math.min(Math.max(parseInt(val('rDay'))||1,1),31);

      const data={name,type:st.type,amount,day,categoryId:val('rCat'),accountId:val('rAcc')||'',method:val('rMethod'),pocketId:st.type==='gasto'?(val('rPocket')||''):'',isSub:st.type==='gasto'&&o.querySelector('#rSub').checked};

  });
}

/* ============ Exportar / importar ============ */
function download(name, content, type){
  const blob = content instanceof Blob ? content : new Blob([content],{type});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function exportCSV(scope){
  const list = scope==='all' ? [...S.movements].sort((a,b)=>a.date.localeCompare(b.date)) : filteredMovs().reverse();
  if(!list.length){ toast('No hay movimientos que exportar','over'); return; }
  const q=v=>{ v=String(v??''); return /[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; };
  const rows=[['Fecha','Tipo','Categoría','Importe','Método de pago','Cuenta','Pocket','Nota','Recurrente']];
  for(const m of list){ const [y,mo,d]=m.date.split('-'); rows.push([`${d}/${mo}/${y}`, m.type==='ingreso'?'Ingreso':'Gasto', cat(m.categoryId).name, (m.type==='ingreso'?'':'-')+m.amount.toFixed(2).replace('.',','), m.method, acc(m.accountId)?.name||'', pocket(m.pocketId)?.name||'', m.note||'', m.recurringId?'Sí':'No']); }
  const csv='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  download(scope==='all'?'movimientos-todos.csv':`movimientos-${ui.month}.csv`, csv, 'text/csv;charset=utf-8');
  toast(`Exportados ${list.length} movimientos`,'ok');
}

function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d || !Array.isArray(d.movements) || !Array.isArray(d.categories)) throw new Error('El archivo no es una copia de esta app');
      if(!confirm(`Se reemplazarán tus datos actuales por la copia (${d.movements.length} movimientos). ¿Continuar?`)) return;
      const keep={apiKey:S.settings.apiKey, syncPass:S.settings.syncPass, syncUrl:S.settings.syncUrl}; S=d; migrate(); Object.assign(S.settings, keep); runRecurring(); save(); render(); toast('Copia importada correctamente','ok'); }
    catch(e){ toast('No se pudo importar: '+e.message,'over'); } };
  r.readAsText(file);
}

function loadSample(){

  let seed=42; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  const between=(a,b)=>round2(a+rnd()*(b-a));
  const t=todayStr(), cur=ymOf(t), start=addMonths(cur,-3);
  S.settings.demo=true;
  S.settings.sampleBudgets=S.settings.sampleBudgets||[];
  const cb=(id,b)=>{ const c=S.categories.find(x=>x.id===id); if(c && !c.budget){ c.budget=b; S.settings.sampleBudgets.push(id); } };
  cb('super',300); cb('fuera',150); cb('ocio',120); cb('transporte',420); cb('ropa',100); cb('subs',45);
  if(!S.pockets.length){
    S.pockets=[

  S.recurring.push(
    R('Nómina','ingreso',1850,'nomina','santander',1,'Transferencia'),
    R('Recibo del coche','gasto',245,'transporte','santander',5,'Domiciliación'),
    R('Gimnasio','gasto',39.9,'salud','santander',3,'Domiciliación'),
    R('Netflix','gasto',13.99,'subs','bbva',8,'Tarjeta',true),

    R('iCloud+','gasto',2.99,'subs','bbva',15,'Tarjeta',true),
    R('Amazon Prime','gasto',4.99,'subs','bbva',20,'Tarjeta',true),
    R('Seguro de salud','gasto',42,'salud','santander',10,'Domiciliación'),
  );
  const M=(date,type,amount,categoryId,note,pocketId,method='Tarjeta',accountId='revolut')=>S.movements.push({id:uid(),type,amount,categoryId,date,method,accountId,pocketId,note,recurringId:'',sample:true});
  const shops={super:['Mercadona','Lidl','Carrefour','Dia','Mercadona','Alcampo'],fuera:['Cena con amigos','Telepizza','Bar Manolo','Sushi','Brunch','Burger'],ocio:['Cine','Concierto','Entradas pádel','Steam','Bolera','Escape room'],transporte:['Repsol','Cepsa','BP','Parking'],ropa:['Zara','Decathlon','Pull&Bear','Nike'],hogar:['IKEA','Leroy Merlin','Amazon'],regalos:['Cumple de Laura','Regalo mamá']};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  for(let k=0;k<4;k++){
    const m=addMonths(start,k), dim=daysInMonth(m);
    const lastDay = m===cur ? Number(t.slice(8,10)) : dim;
    const scale = k===2 ? 1.15 : k===1 ? 0.9 : 1; // variación entre meses
    const day=()=>`${m}-${pad(1+Math.floor(rnd()*lastDay))}`;
    const frac = lastDay/dim;
    const n=(base)=>Math.max(0,Math.round(base*frac*scale + (rnd()-0.5)));
    for(let i=0;i<n(8);i++) M(day(),'gasto',between(14,62),'super',pick(shops.super),'pk_super');
    for(let i=0;i<n(k===3?7:5);i++) M(day(),'gasto',between(11,38),'fuera',pick(shops.fuera),'pk_fuera');
    for(let i=0;i<n(4);i++) M(day(),'gasto',between(8,35),'ocio',pick(shops.ocio),'pk_ocio');

  }

    {id:uid(),name:'Viaje a Japón',icon:'🗾',color:'#ff5c6c',target:1500,saved:620,deadline:`${addMonths(cur,7)}`,history:[],sample:true},

}

// Vuelve a copiarlo desde la app para actualizar los datos.

const leftOf = p => (p.b !== undefined && p.b !== null) ? p.b : (p.a - p.g);

function eur(n){ const neg=n<0; let [i,d]=Math.abs(n).toFixed(2).split('.'); i=i.replace(/\\B(?=(\\d{3})+(?!\\d))/g,'.'); return (neg?'-':'')+i+','+d+' €'; }
function bar(frac, color, w){
  const h=6, dc=new DrawContext(); dc.size=new Size(w,h); dc.opaque=false; dc.respectScreenScale=true;
  let p=new Path(); p.addRoundedRect(new Rect(0,0,w,h),3,3); dc.addPath(p); dc.setFillColor(new Color('#86868b', 0.25)); dc.fillPath();
  const fw=Math.max(Math.min(frac,1)*w, frac>0?6:0);
  if(fw>0){ p=new Path(); p.addRoundedRect(new Rect(0,0,fw,h),3,3); dc.addPath(p); dc.setFillColor(new Color(frac>1?'#d70015':frac>=0.8?'#b64400':color)); dc.fillPath(); }
  return dc.getImage();
}

function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); }); }
function loadImage(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('No se pudo abrir la imagen')); im.src=src; }); }
async function shrink(file, maxSide, quality){
  const url = URL.createObjectURL(file);
  try{ const im = await loadImage(url); const k = Math.min(1, maxSide/Math.max(im.naturalWidth, im.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', quality); }
  finally{ URL.revokeObjectURL(url); }
}

async function readReceipt(file){
  const apiKey = (S.settings.apiKey||'').trim();
  const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name);
  let block, preview=null;
  if(isPdf){
    if(file.size > 20*1024*1024) throw new Error('El PDF es demasiado grande (máx. 20 MB)');
    const d = await readAsDataURL(file);
    block = {type:'document', source:{type:'base64', media_type:'application/pdf', data:d.split(',')[1]}};
  } else {
    const big = await shrink(file, 1600, 0.85);
    preview = await shrink(file, 900, 0.7);
    block = {type:'image', source:{type:'base64', media_type:'image/jpeg', data:big.split(',')[1]}};
  }
  const Anthropic = await loadSDK();
  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser:true });
  const response = await client.beta.messages.create({
    model:'claude-opus-5-5',
    max_tokens:16000,
    betas:['server-side-fallback-2026-07-01'],
    fallbacks:'default',
    output_config:{ effort:'low', format:{ type:'json_schema', schema:receiptSchema() } },
    messages:[{ role:'user', content:[ block, {type:'text', text:receiptPrompt()} ] }],
  });
  if(response.stop_reason==='refusal') throw new Error('Claude no ha podido procesar este documento');
  if(response.stop_reason==='max_tokens') throw new Error('La respuesta se cortó; inténtalo de nuevo');
  const text = response.content.filter(b=>b.type==='text').map(b=>b.text).join('');
  let data; try{ data = JSON.parse(text); }catch(e){ throw new Error('No se pudo interpretar la respuesta'); }
  return { data, preview };
}
function apiErrorMessage(e){
  const st = e && e.status;
  if(st===401) return 'La clave de la API no es válida. Revísala en Ajustes.';
  if(st===403) return 'Tu clave no tiene permiso para usar este modelo.';
  if(st===429) return 'Demasiadas peticiones o sin crédito en tu cuenta de Anthropic. Inténtalo en un rato.';
  if(st===400 && /credit|balance/i.test(e.message||'')) return 'Tu cuenta de Anthropic no tiene saldo. Añade crédito en console.anthropic.com.';
  if(st>=500) return 'El servicio de Anthropic no responde ahora mismo. Inténtalo de nuevo.';
  if(e && /Failed to fetch|NetworkError|import/i.test(e.message||'')) return 'Sin conexión. Comprueba tu internet e inténtalo de nuevo.';
  return (e && e.message) || 'Error desconocido';
}
function findDuplicate(amount, date){

  return S.movements.find(m=>m.type==='gasto' && Math.abs(m.amount-amount)<0.01 && Math.abs(new Date(m.date).getTime()-t)<=3*864e5);
}

function merchantKey(tx){ return norm(tx.counterparty || tx.description).split(' ').slice(0,3).join(' '); }
function guessCategory(tx, pk){
  const key = merchantKey(tx); const learned = (S.settings.merchantMap||{})[key];
  if(learned && S.categories.some(c=>c.id===learned)) return { id:learned, sure:true };
  const text = norm(tx.counterparty+' '+tx.description);
  if(tx.type==='ingreso'){ for(const [re,id] of INC_RULES) if(re.test(text)) return { id, sure:true }; return { id: tx.amount>=600 ? 'nomina' : 'otros_i', sure: false }; }
  if(tx.mcc) for(const [re,id] of MCC) if(re.test(String(tx.mcc))) return { id, sure:true };
  for(const [re,id] of RULES) if(re.test(text)) return { id, sure:true };
  if(pk && (pk.categories||[]).length) return { id: pk.categories[0], sure:false };
  return { id:'otros_g', sure:false };
}
function guessMethod(tx){
  const t = norm(tx.description);
  if(/bizum/.test(t)) return 'Bizum';
  if(/recibo|adeudo|domicil|cargo/.test(t)) return 'Domiciliación';
  if(/transfer|traspaso/.test(t)) return tx.type==='ingreso' ? 'Transferencia' : 'Transferencia';
  if(/cajero|atm|retirada/.test(t)) return 'Efectivo';
  return tx.type==='ingreso' ? 'Transferencia' : 'Tarjeta';
}
function appAccountFor(tx){
  const a = norm(tx.aspsp);
  for(const [re,id] of [[/santander/,'santander'],[/bbva/,'bbva'],[/revolut/,'revolut'],[/trade/,'traderepublic']]) if(re.test(a) && S.accounts.some(x=>x.id===id)) return id;
  const hit = S.accounts.find(x=>a.includes(norm(x.name))); return hit ? hit.id : '';
}
const isMainRevolut = a => !!a.iban || /^(eur( euro)?|euro|main|principal|cuenta principal|current)$/.test(norm(a.name));

// Revolut envía cada pocket como una cuenta propia: se crean o enlazan con los pockets de la app
function linkPockets(accounts){
  let created=0;
  accounts.filter(a=>/revolut/i.test(a.aspsp) && !isMainRevolut(a)).forEach((a,i)=>{
    let p = S.pockets.find(x=>x.bankUid===a.uid) || S.pockets.find(x=>!x.bankUid && norm(x.name)===norm(a.name));
    if(!p){ p = { id:uid(), name:a.name, icon:'👛', color:COLORS[(S.pockets.length+i)%COLORS.length], monthly:0, categories:[] }; S.pockets.push(p); created++; }
    p.bankUid = a.uid; delete p.sample;
  });
  return created;
}

function markInternal(txs){
  // Un traspaso entre tus cuentas o pockets aparece dos veces (salida y entrada): se detecta por pares
  const out = new Set(txs.filter(t=>t.internal).map(t=>t.id));
  const byAmt = {};
  for(const t of txs){ (byAmt[t.amount.toFixed(2)] = byAmt[t.amount.toFixed(2)] || []).push(t); }
  for(const list of Object.values(byAmt)){
    for(const a of list){ if(out.has(a.id)) continue;
      const b = list.find(x=>x.id!==a.id && !out.has(x.id) && x.account_uid!==a.account_uid && x.type!==a.type && Math.abs(new Date(x.date)-new Date(a.date))<=2*864e5);
      if(b){ out.add(a.id); out.add(b.id); } } }
  for(const t of txs) if(/trade republic/.test(norm(t.counterparty+' '+t.description))) out.add(t.id); // ahorro hacia Trade Republic
  return out;
}

let syncing = false;
async function bankSync({ fromBanks=false, quiet=false }={}){
  if(!syncOn() || syncing) return;
  syncing = true;
  try{
    if(fromBanks){ if(!quiet) toast('Consultando tus bancos…'); await api('/api/sync', { method:'POST' }); }
    const data = await api('/api/data');
    S.bank = { accounts:data.accounts||[], last_sync:data.last_sync, fetched:new Date().toISOString(), log:data.log||[] };
    const newPockets = linkPockets(S.bank.accounts);
    const from = S.settings.syncFrom || todayStr();
    const txs = (data.transactions||[]).filter(t=>t.date && t.date>=from && t.amount>0);
    const internal = markInternal(data.transactions||[]);
    // Reparto del mes: lo que entra (neto) en cada pocket por traspasos, y lo que mandas a Trade Republic
    const ba={}, bs={}, fromYm=from.slice(0,7);
    for(const t of data.transactions||[]){
      if(!internal.has(t.id) || !t.date) continue; const ym=t.date.slice(0,7); if(ym<fromYm) continue;
      const pk=S.pockets.find(p=>p.bankUid && p.bankUid===t.account_uid);
      if(pk){ ba[ym]=ba[ym]||{}; ba[ym][pk.id]=round2((ba[ym][pk.id]||0)+(t.type==='ingreso'?t.amount:-t.amount)); }
      const toTR = /trade republic/.test(norm(t.counterparty+' '+t.description)) && !/trade/.test(norm(t.aspsp));
      if(toTR) bs[ym]=round2((bs[ym]||0)+(t.type==='gasto'?t.amount:-t.amount));
    }
    S.bankAlloc=ba; S.bankSavings=bs;
    const seen = S.settings.bankSeen = S.settings.bankSeen || {};
    const byBankId = new Map(S.movements.filter(m=>m.bankId).map(m=>[m.bankId,m]));
    const fresh=[]; let linked=0, updated=0;
    for(const t of txs){
      if(internal.has(t.id)) continue;
      const pending = t.status && t.status!=='BOOK';
      const ex = byBankId.get(t.id);
      if(ex){ if(ex.bankPending && !pending){ ex.bankPending=false; updated++; } continue; }
      if(seen[t.id]) continue; // borrado por ti: no se vuelve a importar
      const pk = S.pockets.find(p=>p.bankUid && p.bankUid===t.account_uid);
      const accountId = pk ? 'revolut' : appAccountFor(t);
      const near = (m, days) => Math.abs(new Date(m.date)-new Date(t.date)) <= days*864e5;
      // 1) movimiento pendiente que ahora llega confirmado (cambia de id)
      let match = S.movements.find(m=>m.bankPending && m.bankAccount===t.account_uid && m.type===t.type && Math.abs(m.amount-t.amount)<0.01 && near(m,4));
      // 2) ticket o gasto apuntado a mano
      if(!match) match = S.movements.find(m=>!m.bankId && !m.recurringId && !m.sample && m.type===t.type && Math.abs(m.amount-t.amount)<0.01 && near(m,3));
      // 3) gasto fijo generado automáticamente (nómina, coche, gimnasio…): importe parecido
      if(!match) match = S.movements.find(m=>!m.bankId && m.recurringId && m.type===t.type && Math.abs(m.amount-t.amount)<=Math.max(1, m.amount*0.15) && near(m,6) && (!m.accountId || !accountId || m.accountId===accountId));
      if(match){ Object.assign(match, { bankId:t.id, bankAccount:t.account_uid, bankPending:pending, amount:t.amount, date:t.date, accountId: match.accountId||accountId, pocketId: match.pocketId || (pk?pk.id:''), sample:false }); seen[t.id]=1; linked++; continue; }
      const g = guessCategory(t, pk);
      const mv = { id:uid(), type:t.type, amount:t.amount, categoryId:g.id, date:t.date, method:guessMethod(t), accountId, pocketId: t.type==='gasto' && pk ? pk.id : '', note:(t.counterparty || t.description).slice(0,80), recurringId:'', sample:false,
        bankId:t.id, bankAccount:t.account_uid, bankPending:pending, bankDesc:t.description.slice(0,160), merchantKey:merchantKey(t), _t:Date.now() };
      if(!mv.pocketId && t.type==='gasto' && accountId==='revolut'){ const p2=S.pockets.find(p=>(p.categories||[]).includes(g.id)); if(p2) mv.pocketId=p2.id; }
      if(!g.sure) fresh.push({ mv, t:{...t, _pocket: pk?pk.name:''} });
      S.movements.push(mv); seen[t.id]=1;
    }
    const added = txs.filter(t=>byBankId.get(t.id)===undefined && seen[t.id]).length;
    if(fresh.length){
      try{ const res = await aiClassify(fresh.slice(0,80).map(x=>x.t)); fresh.slice(0,80).forEach((x,i)=>{ const c=res[i] && S.categories.find(cc=>cc.id===res[i] && cc.type===x.mv.type); if(c) x.mv.categoryId=c.id; }); }
      catch(e){ console.warn('IA', e); }
    }
    S.settings.lastBankImport = new Date().toISOString();
    save(); render();
    const n = S.movements.filter(m=>m.bankId && seen[m.bankId] && m._t && Date.now()-m._t<60000).length;
    if(!quiet || n) toast(n ? `${n} movimiento${n>1?'s':''} nuevo${n>1?'s':''} del banco${linked?` · ${linked} enlazado${linked>1?'s':''}`:''}` : (linked ? `${linked} movimiento${linked>1?'s':''} enlazado${linked>1?'s':''} con el banco` : 'Todo al día'), 'ok');
    if(newPockets && !quiet) setTimeout(()=>toast(`He creado ${newPockets} pocket${newPockets>1?'s':''} a partir de Revolut. Ponles lo que les asignas al mes.`), 2600);
  }catch(e){ console.warn(e); if(!quiet) toast(e.message || 'No se pudo sincronizar','over'); }
  finally{ syncing=false; }
}

// ---- Copia en la nube (mismo estado en móvil y ordenador) + datos para el widget ----
let pushT=null, pulling=false;
function cleanState(){ const c=JSON.parse(JSON.stringify(S)); delete c.settings.apiKey; delete c.settings.syncPass; delete c.settings.syncUrl; return c; }
function widgetPayload(){ const ym=ymOf(todayStr()); return { mes:monthLabel(ym), pockets:S.pockets.map(p=>({ n:p.name, i:p.icon, c:p.color, a:alloc(p,ym), g:pocketSpent(p.id,ym), uid:p.bankUid||'' })) }; }
function schedulePush(){ if(!syncOn() || pulling) return; clearTimeout(pushT); pushT=setTimeout(pushState, 2500); }
async function pushState(){
  if(!syncOn()) return;
  try{ const r = await api('/api/state', { method:'PUT', body: JSON.stringify({ state:cleanState(), updated:S.settings.updatedAt, device:navigator.userAgent.slice(0,60), widget:widgetPayload() }) }); S.settings.pushedAt=r.updated; localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ console.warn('push', e); }
}
async function pullState({ ask=false }={}){
  if(!syncOn()) return false;
  try{
    const r = await api('/api/state');
    if(!r || !r.state) return false;
    if(r.updated && S.settings.updatedAt && r.updated <= S.settings.updatedAt) return false;
    if(ask && !confirm('Hay datos guardados en tu servidor (de otro dispositivo). ¿Quieres usarlos en este dispositivo? Se sustituirán los datos de aquí.')) return false;
    const keep = { apiKey:S.settings.apiKey, syncPass:S.settings.syncPass, syncUrl:S.settings.syncUrl };
    pulling = true; S = r.state; migrate(); Object.assign(S.settings, keep); S.settings.updatedAt = r.updated; localStorage.setItem(KEY, JSON.stringify(S)); pulling=false;
    render(); return true;
  }catch(e){ pulling=false; console.warn('pull', e); return false; }
}
async function saveSync(){
  const url=(document.getElementById('syncUrl')?.value||'').trim().replace(/\/+$/,''), pass=(document.getElementById('syncPass')?.value||'').trim(), from=document.getElementById('syncFrom')?.value||'';
  if(!/^https:\/\//.test(url)){ toast('La dirección del servidor debe empezar por https://','over'); return; }
  if(!pass){ toast('Escribe la contraseña del servidor','over'); return; }
  S.settings.syncUrl=url; S.settings.syncPass=pass; if(from) S.settings.syncFrom=from;
  try{ await api('/api/data?since=2999-01-01'); }catch(e){ toast(e.message,'over'); return; }
  localStorage.setItem(KEY, JSON.stringify(S));
  const pulled = await pullState({ ask:true });
  if(!pulled && S.settings.demo && confirm('Todavía tienes los datos de ejemplo. ¿Los borro antes de traer tus movimientos reales?')){ const c=window.confirm; window.confirm=()=>true; try{ clearSample(); } finally{ window.confirm=c; } }
  save(); render(); toast('Servidor conectado','ok');
  bankSync();
}

/* ============ Toast ============ */
let toastT;
function toast(msg, kind=''){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast '+kind; d.textContent=msg; document.body.appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(), kind==='over'||kind==='warn'?4200:2400); }

/* ============ Icono app ============ */
function makeIcon(){
  try{ const c=document.createElement('canvas'); c.width=c.height=180; const x=c.getContext('2d');
    x.fillStyle='#1d1d1f'; x.fillRect(0,0,180,180);
    x.fillStyle='#fff'; x.font='600 100px -apple-system, Helvetica, Arial'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('€',90,98);
    const u=c.toDataURL('image/png'); $('#touchIcon').href=u; $('#favIcon').href=u; }catch(e){}
}

  clearFilters(){ ui.f={q:'',cat:'',type:'',method:'',where:''}; render(); },
  openMovement, delMovement, editCategory, editBudget, editRecurring, editPocket, pocketDetail, editAccount, editGoal, goalDetail,

  saveKey(){ const v=(document.getElementById('apiKey')?.value||'').trim(); if(v && !/^sk-ant-/.test(v)){ toast('La clave debería empezar por sk-ant-','over'); return; } S.settings.apiKey=v; save(); render(); toast(v?'Clave guardada':'Clave eliminada','ok'); },
  _state:()=>S, _totals:totals,
};

document.getElementById('scanFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) onScanFile(f); e.target.value=''; });
document.getElementById('importFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=''; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

const fresh = load();
makeIcon();
if(fresh){ loadSample(); } else { runRecurring(); render(); }
if(syncOn()){ pullState().then(()=>bankSync({quiet:true})); }

document.addEventListener('visibilitychange',()=>{ if(document.hidden) return; if(runRecurring()) render(); if(syncOn() && Date.now()-new Date(S.bank?.fetched||0) > 20*60000) pullState().then(()=>bankSync({quiet:true})); });
})();
